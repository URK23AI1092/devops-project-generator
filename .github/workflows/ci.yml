name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch / PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e . flake8

      - name: Lint (syntax errors and undefined names)
        run: flake8 cli generator --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: CLI loads
        run: |
          python -m cli --help
          python -m cli list-options

      - name: Smoke test - generate projects
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          for ci in github-actions gitlab-ci jenkins; do
            python -m cli init --no-interactive --ci "$ci" --name "smoke-$ci" --output "$RUNNER_TEMP/out"
            python -m cli validate "$RUNNER_TEMP/out/smoke-$ci"
          done
          echo "Generated $(find "$RUNNER_TEMP/out" -type f | wc -l) files"

  web-ui:
    name: Web UI (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker:
    name: Docker images
    needs: [cli, web-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Push only for commits on main; PRs just build and test
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        run: |
          # GHCR requires lowercase repository names
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "WEB_IMAGE=$prefix-web" >> "$GITHUB_ENV"
          echo "CLI_IMAGE=$prefix-cli" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web-ui
          load: true
          tags: ${{ env.WEB_IMAGE }}:latest,${{ env.WEB_IMAGE }}:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build CLI image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.CLI_IMAGE }}:latest,${{ env.CLI_IMAGE }}:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=cli
          cache-to: type=gha,mode=max,scope=cli

      - name: Test web container
        run: |
          docker run -d --name web -p 3000:3000 "$WEB_IMAGE:latest"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health >/dev/null
          curl -fsS -o /dev/null http://localhost:3000/
          docker rm -f web

      - name: Test CLI container
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD/out:/work" "$CLI_IMAGE:latest" \
            init --no-interactive --ci github-actions --name docker-smoke
          docker run --rm -v "$PWD/out:/work" "$CLI_IMAGE:latest" validate docker-smoke
          test -f out/docker-smoke/README.md

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: env.PUSH == 'true'
        run: |
          docker push --all-tags "$WEB_IMAGE"
          docker push --all-tags "$CLI_IMAGE"
