name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch / PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e . flake8

      - name: Lint (syntax errors and undefined names)
        run: flake8 cli generator --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: CLI loads
        run: |
          python -m cli --help
          python -m cli list-options

      - name: Smoke test - generate projects
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          for ci in github-actions gitlab-ci jenkins; do
            python -m cli init --no-interactive --ci "$ci" --name "smoke-$ci" --output "$RUNNER_TEMP/out"
            python -m cli validate "$RUNNER_TEMP/out/smoke-$ci"
          done
          echo "Generated $(find "$RUNNER_TEMP/out" -type f | wc -l) files"

  web-ui:
    name: Web UI (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
